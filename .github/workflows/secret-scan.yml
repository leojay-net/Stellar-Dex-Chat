name: Secret Scan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configure Gitleaks allowlist
        run: |
          cat > .gitleaks.toml <<'EOF'
          title = "Stellar Dex Chat Gitleaks configuration"

          [extend]
          useDefault = true

          [allowlist]
          description = "Example environment files contain placeholder values"
          paths = [
            '''(^|/)\.env\.docker$''',
            '''(^|/)\.env\.example$''',
          ]
          EOF

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false