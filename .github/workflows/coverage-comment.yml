name: Frontend Coverage Comment

# Runs in the base repo's context (not the PR head's), so it gets a
# write-capable GITHUB_TOKEN even for PRs from forks. It never checks out
# or executes any code from the PR — it only downloads JSON artifacts produced
# by frontend.yml and lighthouse.yml and posts/updates PR comments from them.
on:
  workflow_run:
    workflows: ["Frontend CI", "Lighthouse CI"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Post coverage comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.name == 'Frontend CI' && github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download coverage report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-coverage-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('frontend-coverage-report.json', 'utf8'));
            const marker = '<!-- frontend-coverage-report -->';

            const row = (label, pct, target) => {
              const status = pct >= target ? '✅' : '⚠️';
              return `| ${label} | ${pct.toFixed(2)}% | ${target}% | ${status} |`;
            };

            const body = [
              marker,
              '### Frontend unit test coverage',
              '',
              `Commit \`${report.head_sha.slice(0, 7)}\``,
              '',
              '| Metric | Coverage | Target | |',
              '|---|---|---|---|',
              row('Statements', report.statements, report.targets.statements),
              row('Branches', report.branches, report.targets.branches),
              row('Functions', report.functions, report.targets.functions),
              row('Lines', report.lines, report.targets.lines),
              '',
              '_Targets are informational — not currently enforced as a CI gate._',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = report.pr_number;

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  lighthouse-comment:
    name: Post Lighthouse score comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.name == 'Lighthouse CI' && github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Download Lighthouse reports
        id: download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lighthouse-reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: lighthouse-reports

      - name: Post or update score comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- lighthouse-ci-scores -->';
            const reportDirectory = 'lighthouse-reports';
            const metadata = JSON.parse(fs.readFileSync(path.join(reportDirectory, 'pr-number.json'), 'utf8'));
            const issue_number = metadata.pr_number;
            if (!Number.isInteger(issue_number)) {
              throw new Error('Lighthouse report artifact is missing a valid pull request number.');
            }

            const files = fs.readdirSync(reportDirectory).filter((file) => /^lhr-[\w-]+\.json$/i.test(file));
            if (files.length === 0) {
              core.warning('No Lighthouse reports were produced; skipping the score comment.');
              return;
            }

            const scoresByPage = new Map();
            for (const file of files) {
              const report = JSON.parse(fs.readFileSync(path.join(reportDirectory, file), 'utf8'));
              const reportUrl = report.requestedUrl || report.finalDisplayedUrl;
              if (typeof reportUrl !== 'string') {
                throw new Error(`Lighthouse report ${file} is missing its URL.`);
              }

              const pathname = new URL(reportUrl).pathname.replace(/\/+$/, '') || '/';
              const page = pathname === '/' ? 'Landing' : pathname === '/chat' ? 'Chat' : null;
              if (!page) continue;

              const categories = report.categories || {};
              const scores = {
                performance: categories.performance?.score,
                accessibility: categories.accessibility?.score,
                bestPractices: categories['best-practices']?.score,
              };
              if (Object.values(scores).some((score) => !Number.isFinite(score))) {
                throw new Error(`Lighthouse report ${file} is missing a required category score.`);
              }

              const pageScores = scoresByPage.get(page) || {
                performance: [],
                accessibility: [],
                bestPractices: [],
              };
              for (const [category, score] of Object.entries(scores)) {
                pageScores[category].push(score);
              }
              scoresByPage.set(page, pageScores);
            }

            const median = (values) => {
              values.sort((a, b) => a - b);
              const middle = Math.floor(values.length / 2);
              return values.length % 2 ? values[middle] : (values[middle - 1] + values[middle]) / 2;
            };
            const format = (score, minimum) => {
              const percentage = `${(score * 100).toFixed(1)}%`;
              return `${percentage} ${score >= minimum ? '✅' : '❌'}`;
            };
            const rows = ['Landing', 'Chat'].map((page) => {
              const scores = scoresByPage.get(page);
              if (!scores) throw new Error(`No Lighthouse scores found for the ${page} page.`);
              return `| ${page} | ${format(median(scores.performance), 0.6)} | ${format(median(scores.accessibility), 0.8)} | ${format(median(scores.bestPractices), 0.9)} |`;
            });
            const body = [
              marker,
              '### Lighthouse CI scores',
              '',
              'Median across three production-build Lighthouse runs per page.',
              '',
              '| Page | Performance (min 60%) | Accessibility (min 80%) | Best practices (min 90%) |',
              '|---|---:|---:|---:|',
              ...rows,
            ].join('\n');

            const { owner, repo } = context.repo;
            const associatedPullRequests = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            if (!associatedPullRequests.data.some((pullRequest) => pullRequest.number === issue_number)) {
              throw new Error('The Lighthouse report PR number is not associated with this workflow run.');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
