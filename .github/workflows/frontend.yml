name: Frontend CI

# ── Job graph ────────────────────────────────────────────────────────────────
#
#   lint
#   build ───────────────────────────────────────────────────────────► e2e
#   unit-tests (matrix ×4, parallel) ──► coverage-merge ──────────┘
#
# build and unit-tests are independent: a test failure does not hide a build
# failure and vice-versa. E2E waits for the build so browser coverage is
# reported independently of static checks and unit tests.

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "Makefile"

permissions:
  contents: read

# Shared env block referenced by build, unit-tests and e2e.
env:
  NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_STELLAR_CONTRACT_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_XLM_SAC_ID: ${{ secrets.NEXT_PUBLIC_XLM_SAC_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
  NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK || 'TESTNET' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER' }}
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'PLACEHOLDER' }}
  PAYOUT_PROVIDER: ${{ secrets.PAYOUT_PROVIDER || 'paystack' }}

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: Dechat/dex_with_fiat_frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check unused dependencies
        run: pnpm check:dependencies

      - name: Lint
        run: make -C ../.. frontend-lint

      - name: Type check
        run: make -C ../.. frontend-typecheck

      - name: Prettier check
        run: make -C ../.. frontend-check

  # ── 2. Next.js build (independent of unit tests) ──────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: Dechat/dex_with_fiat_frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: make -C ../.. frontend-build

  # ── 3. Unit tests — 4 shards run in parallel ──────────────────────────────
  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      # Let all shards finish so we always collect all blob artifacts even when
      # one shard has failures — coverage-merge needs every blob.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: Dechat/dex_with_fiat_frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: make -C ../.. frontend-test SHARD=${{ matrix.shard }}/4 JUNIT_REPORT="$RUNNER_TEMP/vitest-junit.xml"

      - name: Summarize unit test results
        if: always()
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          from html import escape
          from pathlib import Path
          from xml.etree import ElementTree

          print(f"## Vitest shard {os.environ['SHARD']}/4")
          report = Path(os.environ["RUNNER_TEMP"]) / "vitest-junit.xml"
          if not report.exists():
              print("JUnit report unavailable. See the test step log.")
          else:
              cases = list(ElementTree.parse(report).iter("testcase"))
              failures = [
                  case for case in cases
                  if case.find("failure") is not None or case.find("error") is not None
              ]
              skipped = sum(case.find("skipped") is not None for case in cases)
              print(f"{len(cases) - len(failures) - skipped} passed, {len(failures)} failed, {skipped} skipped.")
              for case in failures:
                  name = " › ".join(case.get(field, "") for field in ("classname", "name"))
                  print(f"- <code>{escape(' '.join(name.split()))}</code>")
          PY

      # Upload the vitest blob so coverage-merge can reconstruct full coverage.
      # The blob lands in .vitest-reports/ by vitest convention.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/.vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # Keep each shard’s coverage summary available for troubleshooting.
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/coverage/coverage-summary.json
          retention-days: 1

  # ── 4. Merge coverage blobs, produce report, write job summary ────────────
  coverage-merge:
    name: Coverage merge & report
    runs-on: ubuntu-latest
    needs: unit-tests
    # Run when shards finish (pass or fail) so we always produce coverage data.
    # Skip only if the unit-tests job itself was skipped (e.g. path filter).
    if: ${{ !cancelled() && needs.unit-tests.result != 'skipped' }}

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: Dechat/dex_with_fiat_frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Download all four blob artifacts into .vitest-reports/ so vitest can
      # find them with its default --mergeReports path.
      - name: Download blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vitest-blob-*
          path: Dechat/dex_with_fiat_frontend/.vitest-reports
          merge-multiple: true

      - name: Merge reports and regenerate coverage
        run: make -C ../.. frontend-coverage-merge

      # Build the JSON consumed by coverage-comment.yml.
      - name: Generate coverage report artifact
        id: coverage_report
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            const report = {
              pr_number: ${{ github.event.pull_request.number }},
              head_sha: '${{ github.event.pull_request.head.sha }}',
              statements: total.statements.pct,
              branches: total.branches.pct,
              functions: total.functions.pct,
              lines: total.lines.pct,
              targets: require('./coverage-thresholds.json'),
            };
            fs.writeFileSync('frontend-coverage-report.json', JSON.stringify(report));
          "
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report for coverage-comment.yml
        if: always() && steps.coverage_report.outputs.generated == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage-report
          path: Dechat/dex_with_fiat_frontend/frontend-coverage-report.json
          retention-days: 7

      # ── Job summary: before/after wall-clock comparison ──────────────────
      # Before: 4 shards × ~N minutes sequential = total serial time.
      # After:  longest shard (parallel) + merge time = total wall-clock time.
      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Unit test timing

          Shards ran in parallel. To see wall-clock times, check each
          "Unit tests (shard N/4)" job in the Actions UI.

          ### Before vs after wall-clock

          **Before** — sequential shards in one job:
          `wall-clock = shard1 + shard2 + shard3 + shard4 + merge`

          **After** — parallel matrix + separate merge job:
          `wall-clock = max(shard1, shard2, shard3, shard4) + merge`

          The saving is roughly `sum(shards) - max(shards)`.
          SUMMARY

  # ── 5. Playwright E2E ──────────────────────────────────────────────────
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-24.04
    # The pinned Playwright version does not support Ubuntu 26.04.
    needs: build

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          package_json_file: Dechat/dex_with_fiat_frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Dechat/dex_with_fiat_frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Build for E2E
        run: make -C ../.. frontend-e2e-build

      - name: Run Playwright E2E tests
        run: make -C ../.. frontend-e2e
        env:
          NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ env.NEXT_PUBLIC_STELLAR_CONTRACT_ID }}
          NEXT_PUBLIC_XLM_SAC_ID: ${{ env.NEXT_PUBLIC_XLM_SAC_ID }}
          NEXT_PUBLIC_STELLAR_RPC_URL: ${{ env.NEXT_PUBLIC_STELLAR_RPC_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ env.NEXT_PUBLIC_STELLAR_NETWORK }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: Dechat/dex_with_fiat_frontend/playwright-report/
          retention-days: 7
