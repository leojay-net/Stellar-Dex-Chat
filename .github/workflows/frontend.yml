name: Frontend CI

# ── Job graph ────────────────────────────────────────────────────────────────
#
#   lint ──────────────────────────────────────────────────────────┐
#   build ─────────────────────────────────────────────────────────┤──► e2e
#   unit-tests (matrix ×4, parallel) ──► coverage-merge ──────────┘
#
# build and unit-tests are independent: a test failure does not hide a build
# failure and vice-versa.  e2e waits only for build + lint so it starts as
# soon as the app compiles, without waiting for unit tests.

on:
  pull_request:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "Dechat/dex_with_fiat_frontend/**"

permissions:
  contents: read

# Shared env block referenced by build, unit-tests and e2e.
env:
  NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ secrets.NEXT_PUBLIC_STELLAR_CONTRACT_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_XLM_SAC_ID: ${{ secrets.NEXT_PUBLIC_XLM_SAC_ID || 'PLACEHOLDER' }}
  NEXT_PUBLIC_STELLAR_RPC_URL: ${{ secrets.NEXT_PUBLIC_STELLAR_RPC_URL || 'https://soroban-testnet.stellar.org' }}
  NEXT_PUBLIC_STELLAR_NETWORK: ${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK || 'TESTNET' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'PLACEHOLDER' }}
  PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY || 'PLACEHOLDER' }}
  PAYOUT_PROVIDER: ${{ secrets.PAYOUT_PROVIDER || 'paystack' }}

jobs:
  # ── 1. Lint & type-check ──────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Prettier check
        run: pnpm check

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

  # ── 2. Next.js build (independent of unit tests) ──────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

  # ── 3. Unit tests — 4 shards run in parallel ──────────────────────────────
  unit-tests:
    name: Unit tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest

    strategy:
      # Let all shards finish so we always collect all blob artifacts even when
      # one shard has failures — coverage-merge needs every blob.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests (shard ${{ matrix.shard }}/4)
        run: |
          pnpm vitest run \
            --coverage \
            --maxWorkers=1 \
            --pool=forks \
            --no-file-parallelism \
            --reporter=blob \
            --reporter=dot \
            --coverage.reporter=json-summary \
            --coverage.clean \
            --shard=${{ matrix.shard }}/4
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      # Upload the vitest blob so coverage-merge can reconstruct full coverage.
      # The blob lands in .vitest-reports/ by vitest convention.
      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/.vitest-reports/
          retention-days: 1

      # Upload per-shard coverage-summary.json so coverage-merge has something
      # to work with even if --mergeReports fails.
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary-${{ matrix.shard }}
          path: Dechat/dex_with_fiat_frontend/coverage/coverage-summary.json
          retention-days: 1

  # ── 4. Merge coverage blobs, produce report, write job summary ────────────
  coverage-merge:
    name: Coverage merge & report
    runs-on: ubuntu-latest
    needs: unit-tests
    # Run when shards finish (pass or fail) so we always produce coverage data.
    # Skip only if the unit-tests job itself was skipped (e.g. path filter).
    if: needs.unit-tests.result != 'skipped'

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      # Download all four blob artifacts into .vitest-reports/ so vitest can
      # find them with its default --mergeReports path.
      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vitest-blob-*
          path: Dechat/dex_with_fiat_frontend/.vitest-reports
          merge-multiple: true

      - name: Merge reports and regenerate coverage
        run: |
          pnpm vitest run \
            --mergeReports \
            --coverage \
            --reporter=default
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        # NOTE: coverage.thresholds are not configured in vitest.config.ts yet.
        # The numbers below (stmt 70%, branch 65%, fn 70%, lines 70%) are targets
        # only; this step does not fail on low coverage until thresholds are added.

      # Build the JSON consumed by coverage-comment.yml.
      - name: Generate coverage report artifact
        id: coverage_report
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "No coverage summary found."
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            const report = {
              pr_number: ${{ github.event.pull_request.number }},
              head_sha: '${{ github.event.pull_request.head.sha }}',
              statements: total.statements.pct,
              branches: total.branches.pct,
              functions: total.functions.pct,
              lines: total.lines.pct,
              targets: { statements: 70, branches: 65, functions: 70, lines: 70 },
            };
            fs.writeFileSync('frontend-coverage-report.json', JSON.stringify(report));
          "
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report for coverage-comment.yml
        if: always() && steps.coverage_report.outputs.generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage-report
          path: Dechat/dex_with_fiat_frontend/frontend-coverage-report.json
          retention-days: 7

      # ── Job summary: before/after wall-clock comparison ──────────────────
      # Before: 4 shards × ~N minutes sequential = total serial time.
      # After:  longest shard (parallel) + merge time = total wall-clock time.
      - name: Write job summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Unit test timing

          Shards ran in parallel. To see wall-clock times, check each
          "Unit tests (shard N/4)" job in the Actions UI.

          ### Before vs after wall-clock

          **Before** — sequential shards in one job:
          `wall-clock = shard1 + shard2 + shard3 + shard4 + merge`

          **After** — parallel matrix + separate merge job:
          `wall-clock = max(shard1, shard2, shard3, shard4) + merge`

          The saving is roughly `sum(shards) - max(shards)`.
          SUMMARY

  # ── 5. Playwright E2E — waits only for build + lint ──────────────────────
  e2e:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [build, lint]

    defaults:
      run:
        working-directory: Dechat/dex_with_fiat_frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('Dechat/dex_with_fiat_frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium firefox webkit

      - name: Build for E2E
        run: pnpm build

      - name: Run Playwright E2E tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_STELLAR_CONTRACT_ID: ${{ env.NEXT_PUBLIC_STELLAR_CONTRACT_ID }}
          NEXT_PUBLIC_XLM_SAC_ID: ${{ env.NEXT_PUBLIC_XLM_SAC_ID }}
          NEXT_PUBLIC_STELLAR_RPC_URL: ${{ env.NEXT_PUBLIC_STELLAR_RPC_URL }}
          NEXT_PUBLIC_STELLAR_NETWORK: ${{ env.NEXT_PUBLIC_STELLAR_NETWORK }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: Dechat/dex_with_fiat_frontend/playwright-report/
          retention-days: 7
