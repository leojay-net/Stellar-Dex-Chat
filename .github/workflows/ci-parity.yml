name: Local CI parity

on:
  pull_request:
    branches: [main]
    paths:
      - Makefile
      - .github/workflows/ci-parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-ci:
    name: Run make ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: PLACEHOLDER
      PAYSTACK_SECRET_KEY: PLACEHOLDER
      PAYOUT_PROVIDER: paystack

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: Dechat/dex_with_fiat_frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: Dechat/dex_with_fiat_frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: Dechat/stellar-contracts -> target
      - name: Install frontend dependencies and browsers
        working-directory: Dechat/dex_with_fiat_frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Install Stellar CLI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libudev-dev pkg-config
      - name: Install contract tooling
        run: |
          cargo install --locked stellar-cli --version 28.0.0
          cargo install --locked cargo-deny --version 0.20.2
      - run: make ci
