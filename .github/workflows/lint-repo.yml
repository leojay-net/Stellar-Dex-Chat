name: Lint Repo

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======|>>>>>>> )' -- ":(exclude).github/workflows/lint-repo.yml" ":(exclude).husky/pre-commit" ":(exclude)scripts/check-conflict-markers.sh"; then
            echo "❌ Conflict markers found in the repository!"
            exit 1
          fi

      - name: Ensure no npm or yarn lockfiles
        run: |
          found=$(find . -name "package-lock.json" -o -name "yarn.lock" | grep -v "node_modules/")
          if [ -n "$found" ]; then
            echo "❌ ERROR: Found npm/yarn lockfiles. Use pnpm only."
            echo "$found"
            exit 1
          fi

      - name: Run actionlint
        uses: reviewdog/action-actionlint@ee28dc79d2c7e07b6a9c8abcf817194ab959c473 # v1.44.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          filter_mode: nofilter
          fail_on_error: true
